name: Backend verification
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python scripts/init_env.py
      - run: PUBLIC_DOMAIN=demo.example.com docker compose -f compose.public.yml config --quiet
      - run: docker compose -p qm-tests -f compose.test.yml up -d --wait
      - run: python scripts/test_native.py
      - run: docker compose up -d --build --scale worker=2 --wait
      - run: python scripts/smoke.py
      - if: always()
        run: docker compose logs --no-color > docs/compose-ci.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: |
            docs/native-test-results.xml
            docs/compose-ci.log
      - if: always()
        run: docker compose down -v && docker compose -p qm-tests -f compose.test.yml down -v
